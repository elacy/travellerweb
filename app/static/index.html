<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravellerWeb — Trade Route Planner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>TravellerWeb</h1>
    <span class="subtitle">Trade route planner — Traveller RPG</span>
  </header>

  <main>
    <section class="preset-bar">
      <button id="load-preset" class="primary">Load default fleet (Pirates of Drinax)</button>
      <button id="clear-all">Clear</button>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="route">Route</button>
      <button class="tab" data-tab="fleet">Fleets</button>
      <button class="tab" data-tab="txs">Transactions</button>
      <button class="tab" data-tab="json">JSON</button>
    </nav>

    <section id="tab-route" class="tab-panel">
      <h2>Route</h2>
      <div class="route-fleet-bar">
        <label>Fleet
          <select id="route-fleet-select">
            <option value="">— choose saved fleet —</option>
          </select>
        </label>
        <span class="hint" id="route-fleet-status"></span>
      </div>

      <div class="grid route-grid">
        <div class="loc-block start-loc-block">
          <div class="loc-title">Start system</div>
          <div id="start-loc"></div>
        </div>
        <label>Start year
          <input type="number" data-path="start_date.year">
        </label>
        <label>Start day
          <input type="number" data-path="start_date.day">
        </label>
        <label>Starting capital (Cr)
          <input type="number" data-path="capital">
        </label>
        <label>Uncut profits (Cr)
          <input type="number" data-path="uncut_profits" value="0">
        </label>
        <label>Max profit (optional)
          <input type="number" data-path="max_profit" placeholder="blank = none">
        </label>
        <label>Max duration, weeks (optional)
          <input type="number" data-path="max_duration" placeholder="blank = none">
        </label>
      </div>

      <div class="route-lists">
        <div class="list-block">
          <h3>Stops <button class="ghost small" id="add-stop">+</button></h3>
          <div id="stops"></div>
        </div>
        <div class="list-block">
          <h3>Avoid <button class="ghost small" id="add-avoid">+</button></h3>
          <div id="avoid"></div>
        </div>
      </div>

      <button id="plan-btn" class="primary big">Plan route</button>
    </section>

    <section id="tab-fleet" class="tab-panel" hidden>
      <h2>Fleets</h2>
      <div class="fleet-bar">
        <input id="fleet-name" placeholder="Fleet name">
        <button id="save-fleet" class="primary">Save fleet</button>
        <select id="fleet-select"></select>
        <button id="load-fleet">Load</button>
        <button id="delete-fleet" class="danger">Delete</button>
      </div>

      <div class="fleet-contract">
        <h3>Fleet contract</h3>
        <label>Contract
          <select data-path="fleet.contract.type">
            <option value="none">None</option>
            <option value="drinax">Drinax — % cut of group profit</option>
          </select>
        </label>
        <label id="drinax-pct-row">Drinax cut (%)
          <input type="number" data-path="fleet.contract.percentage" min="0" max="100" step="0.5">
        </label>
      </div>

      <div class="route-lists fleet-lists">
        <div class="list-block">
          <h3>Fuel dumps <button class="ghost small" id="add-fueldump">+</button></h3>
          <div id="fueldumps"></div>
        </div>
      </div>

      <h3>Ships</h3>
      <div id="ships"></div>
      <button id="add-ship" class="ghost">+ Add ship</button>
    </section>

    <section id="tab-txs" class="tab-panel" hidden>
      <h2>Transactions</h2>
      <p class="hint tx-fleet-note" id="tx-fleet-label"></p>
      <div class="tx-toolbar">
        <label>Opening balance (Cr)
          <input type="number" id="tx-opening" step="0.01" placeholder="0">
        </label>
      </div>
      <div class="tx-summary" id="tx-summary"></div>
      <div class="tx-form">
        <label>Date
          <input type="date" id="tx-date">
        </label>
        <label>Type
          <select id="tx-type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>
        <label>Amount (Cr)
          <input type="number" id="tx-amount" min="0" step="0.01" placeholder="0">
        </label>
        <label>Category
          <input type="text" id="tx-category" list="tx-cats" placeholder="e.g. Fuel">
        </label>
        <label>Note
          <input type="text" id="tx-note" placeholder="optional">
        </label>
        <button id="tx-add" class="primary">Add transaction</button>
        <button id="tx-cancel" hidden>Cancel</button>
      </div>
      <datalist id="tx-cats">
        <option value="Fuel"></option>
        <option value="Maintenance"></option>
        <option value="Mortgage"></option>
        <option value="Crew wages"></option>
        <option value="Cargo buy"></option>
        <option value="Cargo sale"></option>
        <option value="Repairs"></option>
        <option value="Berthing"></option>
        <option value="Refit"></option>
        <option value="Other"></option>
      </datalist>
      <div id="tx-list"></div>
    </section>

    <section id="tab-json" class="tab-panel" hidden>
      <p class="hint">Edit the raw configuration as JSON. <em>Load JSON</em> populates the form; <em>Export from form</em> reads the current form state.</p>
      <textarea id="json-editor" spellcheck="false"></textarea>
      <div class="json-actions">
        <button id="load-json" class="primary">Load JSON</button>
        <button id="export-json" class="ghost">Export from form</button>
      </div>
    </section>

    <section id="results" hidden>
      <h2>Results</h2>
      <div class="results-actions">
        <button id="copy-markdown" class="primary">Copy Markdown</button>
        <span id="copy-status" class="hint"></span>
      </div>
      <div id="error-box" class="error" hidden></div>
      <div id="route-output" class="markdown-body"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
